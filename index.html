  <main>
    <div class="intro-text">

      <!-- Swipeable image slider -->
      <div class="image-slider" id="slider">
        <div class="slider-track" id="track">
          <img src="assets/pics/1a73a79a-d123-49c4-a1b3-858365478241.jpg" alt="MJ Photo 1">

  <footer>
    <p>Philippians 4:13</p>
  </footer>

  <script>
    const track = document.getElementById('track');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const slides = document.querySelectorAll('#track img');
    const totalSlides = slides.length;
    let index = 0;
    let startX = 0;
    let isDragging = false;
    let currentTranslate = 0;
    let prevTranslate = 0;

    function updateSlider() {
      track.style.transform = `translateX(-${index * 350}px)`;
    }

    next.addEventListener('click', () => {
      index = (index + 1) % totalSlides;
      updateSlider();
    });

    prev.addEventListener('click', () => {
      index = (index - 1 + totalSlides) % totalSlides;
      updateSlider();
    });

    // Touch events
    track.addEventListener('touchstart', startDrag);
    track.addEventListener('touchmove', dragMove);
    track.addEventListener('touchend', endDrag);

    // Mouse drag
    track.addEventListener('mousedown', startDrag);
    track.addEventListener('mousemove', dragMove);
    track.addEventListener('mouseup', endDrag);
    track.addEventListener('mouseleave', endDrag);

    function startDrag(e) {
      isDragging = true;
      startX = getPositionX(e);
      track.style.transition = 'none';
    }

    function dragMove(e) {
      if (!isDragging) return;
      const currentX = getPositionX(e);
      const diff = currentX - startX;
      currentTranslate = prevTranslate + diff;
      track.style.transform = `translateX(${currentTranslate}px)`;
    }

    function endDrag() {
      if (!isDragging) return;
      isDragging = false;
      const movedBy = currentTranslate - prevTranslate;
      if (movedBy < -100 && index < totalSlides - 1) index++;
      if (movedBy > 100 && index > 0) index--;
      updateSlider();
      prevTranslate = -index * 350;
      track.style.transition = 'transform 0.4s ease';
    }

    function getPositionX(e) {
      return e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;
    }

    slides.forEach(img => img.addEventListener('dragstart', e => e.preventDefault()));
  </script>
</body>
</html>
